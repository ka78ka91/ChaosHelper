plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	// Bundle Baritone (LGPL-3.0) as a nested Fabric mod so the player does not
	// have to install it separately. Loom's `include` configuration rejects
	// local file artifacts, so the jar is copied into META-INF/jars and declared
	// in fabric.mod.json by hand - the standard Jar-in-Jar layout. The bridge
	// still talks to it through reflection only. See NOTICE for attribution.
	from("libs/baritone-api-fabric-1.17.0.jar") {
		into "META-INF/jars"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("NOTICE") {
		rename { "${it}_$projectName" }
	}
}

// Standalone API jar for dynamic modules: contains only com/chaoshelper/api/**,
// no Minecraft/Fabric/Mixin classes and no fabric.mod.json, so it can never be
// loaded as a mod by accident.
tasks.register("apiJar", Jar) {
	group = "build"
	description = "API-only jar (classifier: api) used to compile dynamic modules"
	archiveClassifier = "api"
	from(sourceSets.main.output) {
		include "com/chaoshelper/api/**"
	}
}

tasks.named("assemble") {
	dependsOn("apiJar")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
